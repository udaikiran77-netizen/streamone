plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.streamone.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.streamone.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // The vendored CloudStream library (Phase 4) uses its own opt-in
        // annotations throughout, and some of its dependencies are published
        // with newer Kotlin metadata than the compiler we pin.
        freeCompilerArgs += [
            '-Xskip-metadata-version-check',
            '-opt-in=com.lagradost.cloudstream3.InternalAPI',
            '-opt-in=com.lagradost.cloudstream3.Prerelease',
            '-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
            '-opt-in=kotlinx.serialization.InternalSerializationApi',
            '-opt-in=kotlin.ExperimentalStdlibApi',
            '-opt-in=kotlin.uuid.ExperimentalUuidApi',
            '-opt-in=kotlin.time.ExperimentalTimeApi'
        ]
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    // Player (Phase 1: engine ready, wired to provider streams in Phase 2)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // Images
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // Networking for provider engine
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Provider engine: QuickJS runtime that executes Vega provider bundles,
    // plus coroutines for the engine/UI plumbing
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // --- Phase 4: CloudStream extensions engine -------------------------
    // The vendored CloudStream library (com.lagradost.cloudstream3, copied
    // from the upstream library module) needs the same dependency set the
    // upstream library module builds against. Versions match the fork's
    // gradle/libs.versions.toml unless noted.
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.21'
    // JSON: Jackson is the library's primary parser (AppUtils.parseJson/toJson)
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    // HTML parsing
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'com.fleeksoft.ksoup:ksoup:0.2.6'
    // Networking: NiceHttp is what `com.lagradost.cloudstream3.app` wraps
    implementation 'com.github.Blatzar:NiceHttp:0.4.18'
    implementation 'io.ktor:ktor-http:3.5.0'
    // Date/time + IO + atomics used across the library
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-io-core:0.9.1'
    implementation 'org.jetbrains.kotlinx:atomicfu:0.33.0'
    // Cryptography used by extractor helpers (AES/MD5)
    implementation 'dev.whyoleg.cryptography:cryptography-core:0.6.0'
    implementation 'dev.whyoleg.cryptography:cryptography-provider-optimal:0.6.0'
    // JavaScript for JsInterpreter / unpackers, YouTube extraction
    implementation 'org.mozilla:rhino:1.8.1'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.3'
}
